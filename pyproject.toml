[project]
name = "unijui-ciencia-de-dados"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Saymon", email = "saymon.patrick@sou.unijui.edu.br" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pymysql>=1.2.4",
    "sqlalchemy>=2.1.9",
]

[project.scripts]
unijui-ciencia-de-dados = "unijui_ciencia_de_dados:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "jupytext>=1.19.6",
]
